<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Choisir une source de capture</title>
<style>
  :root{
    --bg:#071522; --panel:#0d2233; --border:#1c3a52; --text:#e7f1f8;
    --text-dim:#93aabb; --accent:#4fc3f7; --accent-bg:#123449;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{ padding:14px 18px 8px; }
  header h1{ font-size:15px; margin:0 0 10px; font-weight:600; }
  .tabs{ display:flex; gap:6px; }
  .tab{
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
    background:transparent; color:var(--text-dim); border:1px solid var(--border);
  }
  .tab.active{ background:var(--accent-bg); color:var(--accent); border-color:var(--accent); }
  .grid{
    flex:1; overflow-y:auto; padding:14px 18px; display:grid;
    grid-template-columns:repeat(3, 1fr); gap:12px; align-content:start;
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    cursor:pointer; overflow:hidden; transition:border-color .12s, transform .12s;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .thumb{
    width:100%; height:110px; background:#02090f; display:flex;
    align-items:center; justify-content:center; overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:contain; }
  .thumb.empty{ color:var(--text-dim); font-size:11px; }
  .name{ padding:8px 10px; font-size:12px; color:var(--text); word-break:break-word; }
  footer{
    padding:10px 18px; border-top:1px solid var(--border);
    display:flex; justify-content:flex-end;
  }
  .cancel{
    background:transparent; color:var(--text-dim); border:1px solid var(--border);
    border-radius:6px; padding:7px 16px; cursor:pointer; font-size:13px;
  }
  .cancel:hover{ color:var(--text); border-color:var(--text-dim); }
  .empty-msg{ color:var(--text-dim); font-size:13px; padding:20px; }
</style>
</head>
<body>
  <header>
    <h1>Choisir ce que tu veux capturer</h1>
    <div class="tabs">
      <button class="tab active" data-type="screen">Écrans</button>
      <button class="tab" data-type="window">Fenêtres</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    <button class="cancel" id="cancelBtn">Annuler</button>
  </footer>

<script>
  let allSources = [];
  let currentType = 'screen';

  const grid = document.getElementById('grid');
  const tabs = document.querySelectorAll('.tab');

  function render(){
    const list = allSources.filter(s => s.type === currentType);
    grid.innerHTML = '';
    if(list.length === 0){
      grid.innerHTML = '<div class="empty-msg">Aucune source disponible dans cette catégorie.</div>';
      return;
    }
    for(const s of list){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb ${s.thumbnail ? '' : 'empty'}">
          ${s.thumbnail ? `<img src="${s.thumbnail}" alt="">` : 'Pas d\'aperçu'}
        </div>
        <div class="name">${escapeHtml(s.name || 'Sans nom')}</div>
      `;
      card.addEventListener('click', () => {
        window.pickerAPI.select(s.id);
      });
      grid.appendChild(card);
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentType = tab.dataset.type;
      render();
    });
  });

  document.getElementById('cancelBtn').addEventListener('click', () => {
    window.close();
  });

  window.pickerAPI.onSources((sources) => {
    allSources = sources;
    render();
  });
</script>
</body>
</html>
