<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Choisir une source de capture</title>
<style>
  :root{
    --bg:#071522; --panel:#0d2233; --border:#1c3a52; --text:#e7f1f8;
    --text-dim:#93aabb; --accent:#4fc3f7; --accent-bg:#123449;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{ padding:14px 18px 8px; }
  header h1{ font-size:15px; margin:0 0 10px; font-weight:600; }
  .tabs{ display:flex; gap:6px; }
  .tab{
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
    background:transparent; color:var(--text-dim); border:1px solid var(--border);
  }
  .tab.active{ background:var(--accent-bg); color:var(--accent); border-color:var(--accent); }
  .grid{
    flex:1; overflow-y:auto; padding:14px 18px; display:grid;
    grid-template-columns:repeat(3, 1fr); gap:12px; align-content:start;
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    cursor:pointer; overflow:hidden; transition:border-color .12s, transform .12s;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .thumb{
    width:100%; height:110px; background:#02090f; display:flex;
    align-items:center; justify-content:center; overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:contain; }
  .thumb.empty{ color:var(--text-dim); font-size:11px; }
  .name{ padding:8px 10px; font-size:12px; color:var(--text); word-break:break-word; }
  footer{
    padding:10px 18px; border-top:1px solid var(--border);
    display:flex; justify-content:flex-end;
  }
  .cancel{
    background:transparent; color:var(--text-dim); border:1px solid var(--border);
    border-radius:6px; padding:7px 16px; cursor:pointer; font-size:13px;
  }
  .cancel:hover{ color:var(--text); border-color:var(--text-dim); }
  .empty-msg{ color:var(--text-dim); font-size:13px; padding:20px; }
</style>
</head>
<body>
  <header>
    <h1 id="heading">Choisir ce que tu veux capturer</h1>
    <div class="tabs">
      <button class="tab active" data-type="screen">Écrans</button>
      <button class="tab" data-type="window">Fenêtres</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    <button class="cancel" id="cancelBtn">Annuler</button>
  </footer>

<script>
  // Traductions de cette fenêtre (fr/en/ko), tenues à jour en même temps
  // que le dictionnaire principal de index.html. Cette fenêtre est un
  // document Electron séparé (chargé via pickerWindow.loadFile) : elle n'a
  // pas accès au DOM ni au localStorage de la page principale, donc la
  // langue à afficher lui est transmise explicitement par main.js via
  // l'IPC 'picker:lang' (voir picker-preload.js / main.js).
  const PICKER_I18N = {
    fr: {
      title: 'Choisir une source de capture',
      heading: 'Choisir ce que tu veux capturer',
      tabScreen: 'Écrans',
      tabWindow: 'Fenêtres',
      empty: 'Aucune source disponible dans cette catégorie.',
      noPreview: "Pas d'aperçu",
      noName: 'Sans nom',
      cancel: 'Annuler'
    },
    en: {
      title: 'Choose a capture source',
      heading: 'Choose what you want to capture',
      tabScreen: 'Screens',
      tabWindow: 'Windows',
      empty: 'No source available in this category.',
      noPreview: 'No preview',
      noName: 'Unnamed',
      cancel: 'Cancel'
    },
    ko: {
      title: '캡처할 소스 선택',
      heading: '캡처할 화면을 선택하세요',
      tabScreen: '화면',
      tabWindow: '창',
      empty: '이 카테고리에는 사용 가능한 소스가 없습니다.',
      noPreview: '미리보기 없음',
      noName: '이름 없음',
      cancel: '취소'
    }
  };
  let pickerLang = 'fr';
  function t(key){
    return (PICKER_I18N[pickerLang] || PICKER_I18N.fr)[key];
  }

  let allSources = [];
  let currentType = 'screen';

  const grid = document.getElementById('grid');
  const tabs = document.querySelectorAll('.tab');

  function render(){
    const list = allSources.filter(s => s.type === currentType);
    grid.innerHTML = '';
    if(list.length === 0){
      grid.innerHTML = `<div class="empty-msg">${escapeHtml(t('empty'))}</div>`;
      return;
    }
    for(const s of list){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb ${s.thumbnail ? '' : 'empty'}">
          ${s.thumbnail ? `<img src="${s.thumbnail}" alt="">` : escapeHtml(t('noPreview'))}
        </div>
        <div class="name">${escapeHtml(s.name || t('noName'))}</div>
      `;
      card.addEventListener('click', () => {
        window.pickerAPI.select(s.id);
      });
      grid.appendChild(card);
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Applique la langue courante aux éléments statiques (titre de fenêtre,
  // en-tête, onglets, bouton Annuler), puis redessine la grille pour que
  // ses textes générés dynamiquement (message "aucune source", "pas
  // d'aperçu", "sans nom") suivent eux aussi la nouvelle langue.
  function applyPickerLang(){
    document.title = t('title');
    document.documentElement.lang = pickerLang;
    const heading = document.getElementById('heading');
    if (heading) heading.textContent = t('heading');
    const screenTab = document.querySelector('[data-type="screen"]');
    if (screenTab) screenTab.textContent = t('tabScreen');
    const windowTab = document.querySelector('[data-type="window"]');
    if (windowTab) windowTab.textContent = t('tabWindow');
    const cancelBtn = document.getElementById('cancelBtn');
    if (cancelBtn) cancelBtn.textContent = t('cancel');
    render();
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentType = tab.dataset.type;
      render();
    });
  });

  document.getElementById('cancelBtn').addEventListener('click', () => {
    window.close();
  });

  window.pickerAPI.onLang((lang) => {
    if (lang === 'fr' || lang === 'en' || lang === 'ko') pickerLang = lang;
    applyPickerLang();
  });

  window.pickerAPI.onSources((sources) => {
    allSources = sources;
    render();
  });
</script>
</body>
</html>
